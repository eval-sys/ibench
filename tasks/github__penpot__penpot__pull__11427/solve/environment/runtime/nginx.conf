pid /tmp/penpot-nginx.pid;

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_max_body_size 350m;
  sendfile on;

  server {
    listen 3000;
    server_name _;
    root /workspace/app/frontend/resources/public;

    location /internal/assets {
      internal;
      alias /opt/data/assets;
    }

    location /assets {
      proxy_pass http://127.0.0.1:6060/assets;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/export {
      proxy_pass http://127.0.0.1:6061;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
      proxy_pass http://127.0.0.1:6060/api;
      proxy_buffering off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
      access_log off;
      proxy_pass http://127.0.0.1:6060/readyz;
    }

    location ~* \.css$ {
      add_header Cache-Control "no-store, no-cache, max-age=0" always;
      try_files $uri =404;
    }

    location /ws/notifications {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_pass http://127.0.0.1:6060/ws/notifications;
    }

    location / {
      add_header Cache-Control "no-store, no-cache, max-age=0" always;
      try_files $uri /index.html =404;
    }
  }
}
