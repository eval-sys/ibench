# Local identity for Grist's native default user. All credentials are development-only.
issuer: http://oidc:5556
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  responseTypes: [code]
  skipApprovalScreen: true
staticClients:
  - id: grist
    name: Grist
    secret: local-development
    redirectURIs:
      - http://localhost:8484/oauth2/callback
enablePasswordDB: true
staticPasswords:
  - email: you@example.com
    username: You
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
    # Upstream Dex example bcrypt hash for "password".
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
