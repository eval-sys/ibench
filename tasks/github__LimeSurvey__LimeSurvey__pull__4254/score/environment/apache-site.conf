<VirtualHost *:8000>
    DocumentRoot /workspace/app
    <Directory /workspace/app>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <DirectoryMatch "/(assets/packages/ckeditor/plugins/exportpdf|application/extensions/yiiwheels/widgets/redactor/assets)(/|$)">
        Require all denied
    </DirectoryMatch>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
