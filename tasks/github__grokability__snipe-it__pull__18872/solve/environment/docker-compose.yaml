services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    command:
    - sleep
    - infinity
    environment:
      DEV_ENV_SETUP: ${DEV_ENV_SETUP:?}
      DEV_ENV_START: ${DEV_ENV_START:?}
      DEV_ENV_READY: ${DEV_ENV_READY:?}
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_URL: http://localhost:8000
      APP_TIMEZONE: UTC
      APP_LOCALE: en-US
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: '3306'
      DB_DATABASE: snipeit
      DB_USERNAME: snipeit
      DB_PASSWORD: snipeit
      PRIVATE_FILESYSTEM_DISK: local
      PUBLIC_FILESYSTEM_DISK: local_public
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      SECURE_COOKIES: 'false'
      QUEUE_CONNECTION: sync
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: '1025'
      MAIL_USERNAME: 'null'
      MAIL_PASSWORD: 'null'
      MAIL_FROM_ADDR: admin@example.com
      MAIL_FROM_NAME: Snipe-IT
      MAIL_REPLYTO_ADDR: admin@example.com
      MAIL_REPLYTO_NAME: Snipe-IT
      IMAGE_LIB: gd
      COMPOSER_ALLOW_SUPERUSER: '1'
      CI: 'true'
    depends_on:
      mariadb:
        condition: service_healthy
      mailpit:
        condition: service_healthy
  mariadb:
    image: mariadb:11.4.7@sha256:39596f079862334be04f4231664862e55d4febe54309cc62f750f2297de85b06
    environment:
      MARIADB_DATABASE: snipeit
      MARIADB_USER: snipeit
      MARIADB_PASSWORD: snipeit
      MARIADB_ROOT_PASSWORD: local-root-password
    tmpfs:
    - /var/lib/mysql
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 3s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    healthcheck:
      test:
      - CMD
      - /mailpit
      - readyz
      interval: 3s
      timeout: 3s
      retries: 30
  harbor-docker-egress-control-sidecar:
    networks:
      default:
        aliases:
        - main
        - mariadb
        - mailpit
networks:
  default:
    driver: bridge
