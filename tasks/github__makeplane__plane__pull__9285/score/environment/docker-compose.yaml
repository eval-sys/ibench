services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    command:
    - sleep
    - infinity
    env_file:
    - runtime/app.env
    environment:
      DEV_ENV_SETUP: ${DEV_ENV_SETUP:?}
      DEV_ENV_START: ${DEV_ENV_START:?}
      DEV_ENV_READY: ${DEV_ENV_READY:?}
      APP_URL: http://localhost:3000
      CI: 'true'
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-rustfs:
        condition: service_healthy
  plane-db:
    image: postgres:15.7-alpine
    command:
    - postgres
    - -c
    - max_connections=1000
    environment:
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane
      POSTGRES_DB: plane
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U plane -d plane
      interval: 5s
      timeout: 5s
      retries: 30
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 30
  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: plane
      RABBITMQ_DEFAULT_VHOST: plane
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      timeout: 5s
      retries: 30
  plane-rustfs:
    image: rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: access-key
      RUSTFS_SECRET_KEY: plane-secret-key-123
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9000/health >/dev/null
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 60
  harbor-docker-egress-control-sidecar:
    networks:
      default:
        aliases:
        - main
        - plane-db
        - plane-redis
        - plane-mq
        - plane-rustfs
networks:
  default:
    driver: bridge
