services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    command:
    - sleep
    - infinity
    environment:
      DEV_ENV_SETUP: ${DEV_ENV_SETUP:?}
      DEV_ENV_START: ${DEV_ENV_START:?}
      DEV_ENV_READY: ${DEV_ENV_READY:?}
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOMAXPROCS: '4'
      GITEA_WORK_DIR: /tmp/gitea-runtime
  harbor-docker-egress-control-sidecar:
    networks:
      default:
        aliases:
        - main
networks:
  default:
    driver: bridge
