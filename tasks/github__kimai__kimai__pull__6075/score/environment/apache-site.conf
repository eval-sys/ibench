<VirtualHost *:8000>
    ServerName localhost
    DocumentRoot /workspace/app/public
    <Directory /workspace/app/public>
        Require all granted
        AllowOverride All
        DirectoryIndex index.php
    </Directory>
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
