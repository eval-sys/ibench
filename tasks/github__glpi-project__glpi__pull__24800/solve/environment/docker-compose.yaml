services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    command:
    - sleep
    - infinity
    environment:
      DEV_ENV_SETUP: ${DEV_ENV_SETUP:?}
      DEV_ENV_START: ${DEV_ENV_START:?}
      DEV_ENV_READY: ${DEV_ENV_READY:?}
      GLPI_ENVIRONMENT_TYPE: production
      COMPOSER_ALLOW_SUPERUSER: '1'
      CYPRESS_INSTALL_BINARY: '0'
      SCARF_ANALYTICS: 'false'
      DO_NOT_TRACK: '1'
    depends_on:
      mariadb:
        condition: service_healthy
  mariadb:
    image: mariadb:11.4.7@sha256:39596f079862334be04f4231664862e55d4febe54309cc62f750f2297de85b06
    environment:
      MARIADB_DATABASE: glpi
      MARIADB_USER: glpi
      MARIADB_PASSWORD: glpi
      MARIADB_ROOT_PASSWORD: local-root-password
    tmpfs:
    - /var/lib/mysql
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 3s
      timeout: 3s
      retries: 30
  harbor-docker-egress-control-sidecar:
    networks:
      default:
        aliases:
        - main
        - mariadb
networks:
  default:
    driver: bridge
