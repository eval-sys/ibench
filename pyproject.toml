[project]
name = "ibench"
version = "0.1.0"
description = "Validate and run published IBench releases"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "harbor==0.23.0",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "pygments>=2.18,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "typer>=0.16,<1",
    "uvicorn>=0.30,<1",
    "chinesecalendar>=1.11,<2",
]

[project.scripts]
ibench = "ibench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ibench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/ibench/utils/kimicode/trajectory.py"]  # Unmodified pinned upstream source.

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
